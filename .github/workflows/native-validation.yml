name: Native continuation validation
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: native-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  swift:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Compile real Swift checks and parse production feature sources
        run: python3 scripts/ci/run-tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-validation-${{ github.run_id }}
          path: build/ci
          if-no-files-found: error
          retention-days: 14
